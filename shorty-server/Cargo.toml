[package]
name = "shorty-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
domain = { path = "../crates/domain" }
nanoid = { workspace = true }
