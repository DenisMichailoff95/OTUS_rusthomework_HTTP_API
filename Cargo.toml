[workspace]
resolver = "2"
members = ["crates/*", "shorty-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Общие зависимости workspace
[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
axum = "0.8.9"
dashmap = "6.2.1"
http-body-util = "0.1.4"
mime = "0.3.17"
nanoid = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["trace", "timeout", "limit", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"

# Новые зависимости для PostgreSQL, Redis и метрик
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "migrate", "derive", "macros"] }
redis = { version = "0.27.6", features = ["tokio-comp", "connection-manager"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
rand = "0.10.2"
base64 = "0.22"

# gRPC, OpenAPI, JWT
tonic = { version = "0.13.1", features = ["transport"] }
prost = "0.13.5"
prost-types = "0.13.5"
tonic-reflection = { version = "0.13.1", features = ["server"] }
tonic-health = "0.13.1"
utoipa = { version = "5.3.1", features = ["axum_extras", "macros"] }
utoipa-swagger-ui = { version = "9.0.0", features = ["axum"] }
jsonwebtoken = "9.0.0"
argon2 = "0.5.3"
rsa = "0.9.8"
pem = "3.0.5"
sha2 = "0.10.9"
tokio-stream = "0.1.17"